name: Publish to crates.io

on:
  push:
    branches:
      - main   # 仅在 main 分支上触发，防止 PR 或功能分支错误发布

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 可选：检查 Cargo.toml 版本是否已发布，避免无意义的失败
      - name: Check if version already published
        id: check_version
        run: |
          PACKAGE_NAME=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].name')
          CURRENT_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
          if curl -s "https://crates.io/api/v1/crates/${PACKAGE_NAME}/${CURRENT_VERSION}" | grep -q '"version":"'"${CURRENT_VERSION}"'"'; then
            echo "Version already published, skipping publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to crates.io
        if: steps.check_version.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.VNRIT_CARGO }}
        run: cargo publish
